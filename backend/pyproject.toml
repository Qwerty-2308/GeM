[project]
name = "gem-assistant"
version = "0.1.0"
description = "Local, read-only GeM bid analysis for one seller"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
    "playwright>=1.47",  # headless Chromium for the public bid listing
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[project.scripts]
gem-assistant = "gem_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gem_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
